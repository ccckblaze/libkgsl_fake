# Adreno (a5xx) device self-description, recorded property by property from a real aarch64 machine
# machine: aarch64 + Android/bionic (API 23) user mode for that platform's closed-source GPU; re-recording: docs/record.md
# how it was recorded: docs/record.md. type is a KGSL_PROP_* number, value is raw little-endian bytes.
# this table is smaller than a6xx because the a5xx user mode reads fewer properties on the compile path;
# the whole build (compile, save, load, replay) passes against it with FK_STRICT=1 and no property missed.
# override at runtime with FK_PROPS=<file>; no rebuild needed.
